name: tests
on:
  pull_request:
    branches:
      - master
      - prod
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run lint
        run: make lint
      - name: run tests
        run: make docker-test

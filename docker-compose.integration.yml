# Shared configuration for the challenge-bypass-server containers. The service is
# now run as two independent processes (see PR "Run Kafka or API Independently"):
#   - cbp:       HTTP API only (KAFKA_ENABLED=false), serves :2416 for the tests
#   - cbp-kafka: Kafka consumers only (KAFKA_ENABLED defaults to on)
# Both share the same postgres/dynamo/kafka backends.
x-cbp-env: &cbp-env
  DATABASE_URL: postgresql://testuser:testpassword@postgres:5432/testdb?sslmode=disable
  VPC_KAFKA_BROKERS: kafka:9092
  DYNAMODB_ENDPOINT: http://localstack:8000
  ENV: test
  REDEEM_CONSUMER_TOPIC: test.consumer.redeem
  REDEEM_PRODUCER_TOPIC: test.producer.redeem
  SIGN_CONSUMER_TOPIC: test.consumer.sign
  SIGN_PRODUCER_TOPIC: test.producer.sign
  CONSUMER_GROUP: integration-service
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

x-cbp-depends: &cbp-depends
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully
  localstack:
    condition: service_healthy

services:
  cbp:
    build: .
    image: challenge-bypass-server-cbp:integration
    depends_on: *cbp-depends
    environment:
      <<: *cbp-env
      # API-only process: skip the (blocking) Kafka consumers so the HTTP
      # server starts and serves :2416.
      KAFKA_ENABLED: "false"
    ports:
      - "2416:2416"
      - "9090:9090"

  cbp-kafka:
    build: .
    image: challenge-bypass-server-cbp:integration
    depends_on: *cbp-depends
    # Kafka-only process: KAFKA_ENABLED is unset (defaults to on), so this runs
    # the consumers and never starts the HTTP server. No ports are published.
    environment:
      <<: *cbp-env

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpassword
      - POSTGRES_DB=testdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 2s
      retries: 10

  # Single-node KRaft broker: this node is both the broker and the controller
  # quorum, so no ZooKeeper is involved.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Set explicitly: the image otherwise derives the listeners from the
      # advertised listeners, which would drop the CONTROLLER listener.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The tests probe the broker by dialling the leader of a throwaway topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      # Reduce memory usage for testing
      KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64M /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # The consumers subscribe by topic list and do not watch for topics that
  # appear later, so the test topics have to exist before they join. Keep this
  # list in sync with the topic names in x-cbp-env and test-runner.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx128M
    command:
      - /bin/bash
      - -c
      - |
        for topic in test.consumer.redeem test.producer.redeem test.consumer.sign test.producer.sign; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

  localstack:
    image: amazon/dynamodb-local:3.3.0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles:
      - test
    depends_on:
      cbp:
        condition: service_started
      cbp-kafka:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://testuser:testpassword@postgres:5432/testdb?sslmode=disable
      - DYNAMODB_ENDPOINT=http://localstack:8000
      - ENV=test
      - TEST_SHOULD_WRITE_REDEEM_REQUESTS_HERE=test.consumer.redeem
      - TEST_SHOULD_READ_REDEEM_REQUESTS_HERE=test.producer.redeem
      - TEST_SHOULD_WRITE_SIGNING_REQUESTS_HERE=test.consumer.sign
      - TEST_SHOULD_READ_SIGNING_REQUESTS_HERE=test.producer.sign
      - CONSUMER_GROUP=test
    command: ["go", "test", "-tags", "integration", "./integration-tests", "-v", "-count=1"]
